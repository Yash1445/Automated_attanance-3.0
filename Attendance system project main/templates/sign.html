{% extends 'base.html' %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div class="row justify-content-center page-fade"><div class="col-md-6 col-lg-5">
  <div class="card-ui p-4">
    <h4 class="mb-3 text-center">Create Admin Account</h4>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form action="/signup" method="POST">
      <div class="form-floating mb-3"><input class="form-control" name="username" id="username" placeholder="Username" required><label for="username">Username</label></div>
      <div class="form-floating mb-3"><input type="email" class="form-control" name="email" id="email" placeholder="Email" required><label for="email">Email</label></div>
      <div class="form-floating mb-3"><input type="password" class="form-control" name="password" id="password" placeholder="Password" required><label for="password">Password</label></div>
      <div class="form-floating mb-3"><input type="password" class="form-control" name="confirm_password" id="confirm_password" placeholder="Confirm" required><label for="confirm_password">Confirm Password</label></div>
      <button class="btn btn-primary-grad w-100" type="submit">Sign Up</button>
    </form>
  </div>
</div></div>
{% endblock %}
