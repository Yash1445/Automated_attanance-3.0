{% extends 'base.html' %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="row justify-content-center page-fade"><div class="col-md-5 col-lg-4">
  <div class="card-ui p-4">
    <h4 class="mb-3 text-center">Admin Login</h4>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form action="/adminlogin" method="POST">
      <div class="form-floating mb-3"><input class="form-control" name="userName" id="userName" placeholder="Username" required><label for="userName">Username</label></div>
      <div class="form-floating mb-3"><input type="password" class="form-control" name="password" id="password" placeholder="Password" required><label for="password">Password</label></div>
      <button class="btn btn-primary-grad w-100" type="submit"><i class="bi bi-box-arrow-in-right me-1"></i>Login</button>
    </form>
    <div class="d-flex justify-content-between mt-3 small"><a href="/forgot-password">Forgot password?</a><a href="/signup">Create account</a></div>
  </div>
</div></div>
{% endblock %}
