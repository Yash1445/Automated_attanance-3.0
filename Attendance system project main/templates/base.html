<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Face Recognition Attendance System{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='ui.css') }}" rel="stylesheet">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <div class="fx-bg" aria-hidden="true">
    <div class="mesh mesh-1"></div>
    <div class="mesh mesh-2"></div>
    <div class="mesh mesh-3"></div>
    <div class="wave wave-a"></div>
    <div class="wave wave-b"></div>

    <div class="corner-hud top-left"><span class="dot-live"></span>CAM FEED · LIVE</div>
    <div class="corner-hud top-right">AI SECURE MODE</div>
    <div class="corner-bracket br-tl"></div>
    <div class="corner-bracket br-tr"></div>
    <div class="corner-bracket br-bl"></div>
    <div class="corner-bracket br-br"></div>

    <div class="drone-cam">
      <div class="drone-lens"></div>
      <div class="drone-flash"></div>
    </div>
    <div id="particleField"></div>
  </div>

  {% if session.get('logged_in') %}
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top glass-nav">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <img src="{{ url_for('static', filename='images/companylogo.jpg') }}" width="34" height="34" class="rounded-circle" alt="logo"/>
        <span>Face Recognition Attendance System</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topNav"><span class="navbar-toggler-icon"></span></button>
      <div id="topNav" class="collapse navbar-collapse">
        <div class="ms-auto d-flex flex-wrap gap-2 py-2 py-lg-0">
          <a href="/" class="btn btn-sm btn-soft"><i class="bi bi-house-door me-1"></i>Home</a>
          <a href="/admin" class="btn btn-sm btn-soft"><i class="bi bi-speedometer2 me-1"></i>Admin Dashboard</a>
          <a href="/instructions" class="btn btn-sm btn-primary-grad"><i class="bi bi-camera-video me-1"></i>Take Attendance</a>
          <a href="/logout" class="btn btn-sm btn-danger-grad"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
        </div>
      </div>
    </div>
  </nav>
  {% endif %}

  <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

  <main class="container py-4" id="sceneRoot">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (() => {
      const root = document.getElementById('particleField');
      if (root) {
        const count = 24;
        for (let i = 0; i < count; i++) {
          const p = document.createElement('span');
          p.className = 'particle';
          p.style.left = Math.random() * 100 + '%';
          p.style.top = Math.random() * 100 + '%';
          p.style.animationDelay = (Math.random() * 8).toFixed(2) + 's';
          p.style.animationDuration = (8 + Math.random() * 10).toFixed(2) + 's';
          p.style.opacity = (0.12 + Math.random() * 0.32).toFixed(2);
          p.style.transform = `scale(${0.5 + Math.random() * 1.9})`;
          root.appendChild(p);
        }
      }

      // Cursor spotlight glow
      const glow = document.getElementById('cursorGlow');
      if (glow) {
        window.addEventListener('mousemove', (e) => {
          glow.style.left = e.clientX + 'px';
          glow.style.top = e.clientY + 'px';
        });
      }

      // 3D tilt/parallax on cards
      const cards = () => document.querySelectorAll('.card-ui, .stat-card');
      const tilt = (el, x, y) => {
        const rect = el.getBoundingClientRect();
        const rx = ((y - rect.top) / rect.height - 0.5) * -8;
        const ry = ((x - rect.left) / rect.width - 0.5) * 10;
        el.style.transform = `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-4px)`;
      };
      cards().forEach(el => {
        // Scroll-reactive elements manage their own transform in page scripts
        if (el.classList.contains('scroll-fx')) return;
        el.addEventListener('mousemove', e => tilt(el, e.clientX, e.clientY));
        el.addEventListener('mouseleave', () => { el.style.transform = ''; });
      });

      // Magnetic buttons
      document.querySelectorAll('.btn-primary-grad, .btn-soft').forEach(btn => {
        btn.addEventListener('mousemove', e => {
          const r = btn.getBoundingClientRect();
          const x = e.clientX - r.left - r.width / 2;
          const y = e.clientY - r.top - r.height / 2;
          btn.style.transform = `translate(${x * 0.08}px, ${y * 0.08}px)`;
        });
        btn.addEventListener('mouseleave', () => { btn.style.transform = ''; });
      });
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
