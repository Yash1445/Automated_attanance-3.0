{% extends 'base.html' %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="row justify-content-center page-fade"><div class="col-md-6 col-lg-5">
  <div class="card-ui p-4">
    <h4 class="mb-3 text-center">Reset Password</h4>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    {% if success %}<div class="alert alert-success">{{ success }}</div>{% endif %}
    <form action="/forgot-password" method="POST">
      <div class="form-floating mb-3"><input class="form-control" name="username" id="username" placeholder="Username" required><label for="username">Username</label></div>
      <div class="form-floating mb-3"><input type="password" class="form-control" name="new_password" id="new_password" placeholder="New Password" required><label for="new_password">New Password</label></div>
      <div class="form-floating mb-3"><input type="password" class="form-control" name="confirm_password" id="confirm_password" placeholder="Confirm Password" required><label for="confirm_password">Confirm Password</label></div>
      <button class="btn btn-primary-grad w-100" type="submit">Reset Password</button>
    </form>
  </div>
</div></div>
{% endblock %}
